name: Validate anaglyph branch

on:
  push:
    branches:
      - agent/true-anaglyph-stereo
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/true-anaglyph-stereo
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libgtk-3-dev zlib1g-dev libbz2-dev

      - name: Verify stereo geometry
        run: python3 tools/test_anaglyph_geometry.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/validate-anaglyph.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-anaglyph.yml
          git commit -m "Remove temporary anaglyph validation workflow"
          git push origin HEAD:agent/true-anaglyph-stereo
