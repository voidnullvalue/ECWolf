name: Apply true anaglyph implementation

on:
  push:
    branches:
      - agent/true-anaglyph-stereo

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply renderer changes
        run: python3 tools/apply_true_anaglyph.py

      - name: Verify depth-dependent geometry
        run: python3 tools/test_anaglyph_geometry.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit generated source changes
        run: |
          rm tools/apply_true_anaglyph.py
          rm .github/workflows/apply-true-anaglyph.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/c_cvars.cpp src/c_cvars.h src/wl_draw.cpp src/wl_draw.h src/wl_menu.cpp src/wl_parallax.cpp tools/test_anaglyph_geometry.py tools/apply_true_anaglyph.py .github/workflows/apply-true-anaglyph.yml
          git commit -m "Add true depth-dependent anaglyph stereo"
          git push

      - name: Configure ECWolf
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build ECWolf
        run: cmake --build build --parallel 2
